trigger:
- master

pool:
  vmImage: 'windows-2019'

jobs:
- job: PythonTest
  displayName: 'Run lint tests'
  strategy:
    matrix:
      PythonMinVersion:
        python.version: '3.7'
      PythonMaxVersion:
        python.version: '3.10'
  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: $(python.version)
  - script: pip install --upgrade setuptools
    displayName: 'Upgrade setuptools'
  - script: pip install -r $(System.DefaultWorkingDirectory)/Python/Batch/requirements.txt
    displayName: 'Install requirements'
  - script: pip install coveralls flake8 pytest pytest-cov requests_mock
    displayName: 'Install additional packages'
  - script: flake8 $(System.DefaultWorkingDirectory)/Python/Batch
    displayName: 'Run flake8'

- job: JavaTest
  displayName: 'Run Java tests'
  steps:
  - task: Maven@3
    inputs:
      mavenPom: '$(System.DefaultWorkingDirectory)/Java/pom.xml'
      mavenOptions: '-Xmx3072m'
      jdkVersionOption: '1.8'
      jdkArchitectureOption: 'x64'
      publishJUnitResults: false
      testResultsFiles: '**/TEST-*.xml'
      goals: 'package'

- job: DotNetTest
  displayName: 'Run .NET Core tests'
  steps:
  - task: DotNetCoreCLI@2
    inputs:
      command: 'restore'
      projects: '**/*.csproj'
      feedsToUse: 'select'
  - task: DotNetCoreCLI@2
    inputs:
      command: 'build'
      projects: '**/*.csproj'
