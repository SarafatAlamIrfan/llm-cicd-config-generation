name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZD_INITIAL_ENVIRONMENT_CONFIG: ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Log in with Azure (Federated Credentials)
        if: ${{ !empty(vars.AZURE_CLIENT_ID) }}
        run: |
          azd auth login --federated-credential-provider "github" --tenant-id ${{ vars.AZURE_TENANT_ID }}

      - name: Log in with Azure (Client Credentials)
        if: ${{ !empty(secrets.AZURE_CREDENTIALS) }}
        run: |
          echo ${{ secrets.AZURE_CREDENTIALS }} | jq -r '.client_secret' | tr -d '\n'
          azd auth login --client-id ${{ vars.AZURE_CLIENT_ID }} --client-secret ${{ secrets.AZURE_CREDENTIALS | jq -r '.client_secret' | tr -d '\n' }} --tenant-id ${{ vars.AZURE_TENANT_ID }}

      - name: Provision Infrastructure
        run: |
          azd provision --no-prompt --environment-name ${{ vars.AZURE_ENV_NAME }} --location ${{ vars.AZURE_LOCATION }} --subscription-id ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Application
        run: |
          azd deploy --no-prompt --environment-name ${{ vars.AZURE_ENV_NAME }} --location ${{ vars.AZURE_LOCATION }} --subscription-id ${{ vars.AZURE_SUBSCRIPTION_ID }}
