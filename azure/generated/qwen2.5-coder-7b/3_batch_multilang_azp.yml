trigger:
- master

pool:
  vmImage: 'windows-2019'

jobs:
- job: PythonTest
  displayName: 'Run lint tests'
  strategy:
    matrix:
      PythonMinVersion:
        python.version: '3.7'
      PythonMaxVersion:
        python.version: '3.10'
  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
  - script: |
      python -m pip install --upgrade setuptools
      python -m pip install -r $(System.DefaultWorkingDirectory)/Python/Batch/requirements.txt
      python -m pip install coveralls flake8 pytest pytest-cov requests_mock
      flake8 $(System.DefaultWorkingDirectory)/Python/Batch
    displayName: 'Install dependencies and run flake8'

- job: JavaTest
  steps:
  - task: Maven@3
    inputs:
      mavenPomFile: 'pom.xml'
      mavenOptions: '-Xmx3072m'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.8'
      jdkArchitectureOption: 'x64'
      publishJUnitResults: false
      testResultsFiles: '**/TEST-*.xml'
      goals: 'package'

- job: DotNetTest
  steps:
  - task: DotNetCoreCLI@2
    inputs:
      command: 'restore'
      projects: '**/*.csproj'
      feedsToUse: 'select'
  - task: DotNetCoreCLI@2
    inputs:
      command: 'build'
      projects: '**/*.csproj'
